<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/globals.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="navbar show-menu">
        <div class="header-inner-content">

            <h1 class="logo">MU<span>DAY</span></h1>
            <nav>
                <ul>
                    <li><a href="../index/">Home</a></li>
                    <li><a href="../caixa/">Caixa</a></li>
                    <li><a href="../conta/">Conta</a></li>
                </ul>
            </nav>
            <div class="nav-icon-container">
                <button class="menu-button" aria-expanded="false" aria-controls="nav-menu" title="Abrir menu">
                    <img src="../img/menu.png" alt="">
                </button>    
            </div>

        </div>
    </div>

    <div class="centralizar login-box">
        <div class="box">

            
            <form action="/login" method="post" autocomplete="on">
                <fieldset>

                    <legend><b>Login</b></legend>

                    <div class="input-box">
                        <input id="email" name="email" type="email" placeholder="Usuário" required autocomplete="username">
                        <i class="bx bxs-user"></i>
                    </div>

                    <div class="input-box">
                        <input id="senha" name="senha" type="password" placeholder="Senha" required autocomplete="current-password">
                        <i class="bx bxs-lock-alt"></i>
                    </div>
                    
                    <div class="lembrar">
                        <label for="">
                            <input type="checkbox">
                            Lembrar senha
                        </label>
                        <a href="#">Esqueci a senha</a>
                    </div><br>

                    <button type="submit" class="login">Logar</button>

                    <div class="registro">
                        <p>Não tem uma conta? <a href="/cadastro/cadastro.php">Cadastre-se</a></p>
                    </div>
                </fieldset>
            </form>
        </div>  
    </div>  
</body>
</html>
