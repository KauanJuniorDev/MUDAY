<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles/globals.css">
    <title>Login</title>
</head>
<body>
    <div class="navbar show-menu">
        <div class="header-inner-content">

            <h1 class="logo">MU<span>DAY</span></h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login/login.html">login</a></li>
                    <li><a href="caixa.html">Caixa</a></li>
                    <li><a href="conta.html">Conta</a></li>
                </ul>
            </nav>
            <div class="nav-icon-container"><img src="img/menu.png " class="menu-button"></div>

        </div>
    </div>

    <div class="box">
        
        <form action="">
            <fieldset>

                <legend><b>Login</b></legend>

                <div class="input-box">
                    <input type="email" placeholder="Usuário">
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="senha">
                    <i class="bx bxs-lock-alt"></i>
                </div>
                
                <div class="lembrar">
                    <label for="">
                        <input type="checkbox">
                        Lembrar senha
                    </label>
                    <a href="#">Esqueci a senha</a>
                </div><br>

                <button type="submit" class="login">Logar</button>

                <div class="registro">
                    <p>Não tem uma conta? <a href="cadastro/cadastro.html">Cadastre-se</a></p>
                </div>
            </fieldset>
        </form>
    </div>    
</body>
</html>
